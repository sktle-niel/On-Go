name: on_go
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # The shared design system: palettes, theme registry, tokens and the theme
  # controller. The admin console website uses the same package, so both front
  # ends are literally one theme system.
  on_go_design:
    path: packages/on_go_design

  # Domain models and API contracts shared with the admin console website.
  # See packages/on_go_shared and ARCHITECTURE.md.
  on_go_shared:
    path: packages/on_go_shared

  # The On Go API client (HTTP, sessions, the event socket) that implements
  # those contracts. Shared with the console too. See packages/on_go_api.
  on_go_api:
    path: packages/on_go_api

  # Where the mobile session's refresh token is kept: Keychain / Keystore.
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  path_provider: ^2.1.6
  google_sign_in: ^6.2.1
  shared_preferences: ^2.3.2
  livelyness_detection: ^0.0.1+5
  geolocator: ^13.0.1
  mobile_scanner: ^7.1.2
  qr_flutter: ^4.1.0
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true